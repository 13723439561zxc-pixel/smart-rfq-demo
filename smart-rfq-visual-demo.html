<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Apex Precision Demo | CNC RFQ Request</title>
  <style>
    :root {
      --bg: #f5f8fc;
      --surface: #ffffff;
      --surface-2: #eef4ff;
      --text: #10243d;
      --muted: #63748a;
      --line: #d9e3f2;
      --primary: #0f4f9e;
      --primary-2: #0d3f7a;
      --success: #166e4c;
      --shadow: 0 20px 50px rgba(16, 44, 82, 0.12);
      --radius: 20px;
      --max-width: 1120px;
    }

    * {
      box-sizing: border-box;
    }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(180deg, #f8fbff 0%, var(--bg) 45%, #f5f7fb 100%);
      line-height: 1.55;
    }

    a { color: inherit; text-decoration: none; }

    .app-shell { min-height: 100vh; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(215, 228, 244, 0.9);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand-mark {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), #2e77d0);
      box-shadow: 0 10px 24px rgba(15, 79, 158, 0.3);
    }

    .brand-name { min-width: 0; }
    .brand-name strong { display: block; font-size: 15px; line-height: 1.2; }
    .brand-name span { font-size: 11px; color: var(--muted); display: block; white-space: nowrap; text-overflow: ellipsis; overflow: hidden; }

    .nav {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav a {
      text-decoration: none;
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }

    .nav a:hover {
      border-color: #c9d9ee;
      color: var(--text);
    }

    .demo-badge {
      width: min(var(--max-width), calc(100% - 32px));
      margin: 14px auto 0;
      border: 1px dashed #c6d8f2;
      background: #f0f6ff;
      color: #1f4b84;
      border-radius: 999px;
      padding: 9px 14px;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
    }

    main {
      width: min(var(--max-width), calc(100% - 32px));
      margin: 0 auto;
      padding: 18px 0 60px;
    }

    .section {
      margin-top: 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .hero {
      display: grid;
      grid-template-columns: 1.05fr 0.95fr;
      gap: 16px;
      min-height: 420px;
      align-items: stretch;
    }

    .hero-copy {
      padding: clamp(22px, 4vw, 38px);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .tag {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      width: fit-content;
      padding: 7px 10px;
      border-radius: 999px;
      background: #e8f6ef;
      color: var(--success);
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    h1, h2, h3 { line-height: 1.15; }
    h1 { margin: 0; font-size: clamp(32px, 6vw, 56px); letter-spacing: -1.4px; }

    .hero-copy p {
      margin: 14px 0 24px;
      color: var(--muted);
      font-size: clamp(15px, 2.2vw, 18px);
      max-width: 560px;
    }

    .cta { display: flex; flex-wrap: wrap; gap: 10px; }
    .btn {
      border: 0;
      border-radius: 12px;
      padding: 12px 16px;
      font-weight: 800;
      color: #fff;
      background: var(--primary);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .btn:hover { transform: translateY(-1px); background: var(--primary-2); box-shadow: 0 10px 24px rgba(13, 63, 122, 0.22); }
    .btn.secondary { background: #f1f5fb; color: var(--text); border: 1px solid var(--line); }

    .hero-visual {
      border-radius: calc(var(--radius) - 4px);
      background: linear-gradient(160deg, #ffffff 0%, #eff5ff 60%, #d9e5f8 100%);
      position: relative;
      overflow: hidden;
      min-height: 260px;
      border: 1px solid #d8e2f0;
    }

    .machine-photo {
      position: absolute;
      inset: 16px;
      border-radius: 16px;
      background: linear-gradient(145deg, rgba(15, 79, 158, 0.08), rgba(46, 119, 208, 0.04));
      display: grid;
      place-items: center;
      border: 1px solid #dbe7f6;
    }

    .machine-photo::before {
      content: "";
      width: 90%;
      height: 92%;
      border: 4px solid rgba(15,79,158,0.4);
      border-radius: 12px;
      position: relative;
      background:
        linear-gradient(90deg, rgba(15,79,158,.12) 1px, transparent 1px),
        linear-gradient(rgba(15,79,158,.12) 1px, transparent 1px);
      background-size: 26px 26px;
      box-shadow: inset 0 0 0 1px rgba(13,63,122,.15);
    }

    .machine-photo::after {
      content: "CNC Machining Line";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.85);
      color: var(--text);
      font-size: 12px;
      letter-spacing: .3px;
      border: 1px solid #d2dff0;
      font-weight: 700;
    }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
    }

    .section-head p {
      margin: 8px 0 0;
      color: var(--muted);
      max-width: 560px;
      font-size: 14px;
    }

    .section-head h2 { margin: 0; font-size: clamp(24px, 5vw, 34px); letter-spacing: -1px; }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 16px;
      background: #fff;
      transition: border-color .15s ease, transform .15s ease;
    }
    .card:hover { transform: translateY(-2px); border-color: #b9d1f1; box-shadow: 0 12px 24px rgba(32, 66, 108, 0.12); }
    .card-top { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 10px; background: #eef4ff; font-size: 16px; margin-bottom: 10px; }
    .card h3 { margin: 0 0 8px; font-size: 18px; }
    .card p { margin: 0; color: var(--muted); font-size: 13px; }
    .chip-list { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .chip { font-size: 11px; border-radius: 999px; border: 1px solid #d5e2f2; padding: 5px 10px; color: #1f4f89; background: #f4f8ff; font-weight: 600; }

    .workflow {
      margin-top: 14px;
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(4, 1fr);
    }
    .wf {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px;
      background: #fff;
    }
    .wf strong { display: block; margin-bottom: 6px; font-size: 14px; }
    .wf span { color: var(--muted); font-size: 12px; }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .about-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      padding: 14px;
    }
    .about-card h3 { margin: 0 0 6px; font-size: 18px; }
    .about-card p, .about-card ul { margin: 0; color: var(--muted); font-size: 14px; }
    .about-card ul { padding-left: 16px; }
    .about-card li + li { margin-top: 6px; }

    .request-grid {
      display: grid;
      grid-template-columns: .9fr 1.1fr;
      gap: 16px;
    }
    .request-main, .request-side {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #fff;
      padding: 16px;
    }
    .request-main h3, .request-side h3 { margin: 0 0 12px; font-size: 20px; }

    .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 7px; margin-bottom: 14px; }
    .field label { font-size: 12px; font-weight: 700; color: #2f445f; }
    .required { color: #b83f3f; }

    .field input,
    .field select,
    .field textarea {
      border: 1px solid #d1deee;
      border-radius: 10px;
      padding: 11px 12px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      background: #fff;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(15, 79, 158, 0.10);
    }
    .field textarea { min-height: 84px; resize: vertical; }
    .field .help { color: var(--muted); font-size: 11px; }
    .full { grid-column: 1 / -1; }

    .consent {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin: 8px 0 14px;
      color: var(--muted);
      font-size: 13px;
      background: #f6f9ff;
      border: 1px solid #dce6f5;
      padding: 12px;
      border-radius: 10px;
    }
    .consent input { width: 16px; height: 16px; margin-top: 2px; }

    .submit-btn {
      min-height: 44px;
      border: none;
      border-radius: 11px;
      padding: 12px 18px;
      font-weight: 800;
      width: 100%;
      color: #fff;
      background: var(--primary);
    }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .status-box {
      margin-top: 10px;
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 13px;
      border: 1px solid transparent;
      display: none;
    }
    .status-box.show { display: block; }
    .status-box.success { background: #edf8f3; border-color: #c8e6da; color: #0f5f42; }
    .status-box.error { background: #fff1f0; border-color: #f3c3c3; color: #9c3131; }

    .request-side ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; }
    .request-side li { margin-bottom: 8px; }
    .request-side p { color: var(--muted); font-size: 14px; }

    .demo-note {
      margin-top: 10px;
      color: #4a6281;
      font-size: 12px;
      padding: 10px;
      border-left: 3px solid #a5beea;
      background: #f2f7ff;
      border-radius: 10px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translate(-50%, 150px);
      background: #132745;
      color: #fff;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 13px;
      opacity: 0;
      transition: all .22s ease;
      z-index: 40;
      pointer-events: none;
    }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }

    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      margin: 24px 0 14px;
    }

    @media (max-width: 900px) {
      .hero { grid-template-columns: 1fr; }
      .request-grid, .about-grid, .workflow { grid-template-columns: 1fr; }
      .card-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 650px) {
      .topbar { padding: 12px; flex-wrap: wrap; }
      .brand-name span { display: none; }
      .nav { order: 2; width: 100%; justify-content: flex-start; gap: 6px; }
      .nav a { padding: 7px 10px; font-size: 12px; }
      .demo-badge {
        width: calc(100% - 20px);
        margin-top: 10px;
        font-size: 11px;
        padding: 8px 10px;
      }
      .section { padding: 16px; }
      .section-head { flex-direction: column; align-items: flex-start; }
      .form-grid { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar" id="topbar"></header>

    <div class="demo-badge">Demo website — fictional company</div>

    <main>
      <section class="section hero" id="home"></section>
      <section class="section" id="capabilities"></section>
      <section class="section" id="about"></section>
      <section class="section" id="request-a-quote"></section>
    </main>

    <footer>Sales-ready demo page for RFQ collection. No AI pricing, no client portal, no payment flow.</footer>
  </div>

  <div class="toast" id="toast">Saved</div>

  <script>
    const APP_CONFIG = {
      brand: {
        companyName: 'Apex Precision',
        logo: { type: 'text', value: 'AP' },
        tagline: 'Industrial CNC manufacturing platform concept',
        contact: {
          email: 'sales@apexprecision-demo.com',
          phone: '+1 (555) 500-2000',
          location: 'United States (Demo)'
        },
        navigation: [
          { label: 'Home', href: '#home' },
          { label: 'Capabilities', href: '#capabilities' },
          { label: 'About', href: '#about' },
          { label: 'Request a Quote', href: '#request-a-quote' }
        ],
        colors: { primary: '#0f4f9e', secondary: '#0d3f7a' },
        hero: {
          eyebrow: 'Modern CNC Manufacturing RFQ Flow',
          title: 'From Inquiry to Quotation Follow-up, Clearly in One Screen',
          description: 'A lightweight sales page style demo for CNC manufacturers. Potential buyers can submit part requirements, and the team receives complete lead information in a consistent format.',
          ctaPrimary: 'Request a Quote',
          ctaSecondary: 'See Capabilities',
          visualLabel: 'CNC machining and fabrication line',
          strengths: [
            'No account needed',
            'Structured RFQ fields',
            'Lead data saved before follow-up'
          ]
        },
        capabilities: [
          {
            title: 'CNC Milling',
            icon: '⚙',
            description: '3-axis/4-axis milling of bracket systems, jigs, frames and custom process-specific parts.',
            tags: ['demo/example', 'precision tolerances', 'multiple materials']
          },
          {
            title: 'CNC Turning',
            icon: '◐',
            description: 'Rotational parts such as bushings, shafts and adapters for automation and test setups.',
            tags: ['demo/example', 'rotational profiles', 'batch consistency']
          },
          {
            title: 'Materials',
            icon: '▣',
            description: 'Typical material categories and options can be displayed to capture the exact requirement before quoting.',
            tags: ['demo/example', 'Al / SS / CF', 'titanium options']
          },
          {
            title: 'Prototype / Production',
            icon: '◈',
            description: 'Capture prototype-to-production requirements, including finish, material, tolerance and quantity in one RFQ form.',
            tags: ['demo/example', 'small-batch support', 'pilot stage']
          },
          {
            title: 'CNC Machining',
            icon: '⌖',
            description: 'Demonstrate high-value machine-work inquiries: dimensions, finish, tolerance and timeline together.',
            tags: ['demo/example', 'surface quality', 'part complexity']
          }
        ],
        workflow: [
          'Client opens one RFQ page',
          'Buyer selects process and fills key fields',
          'Request is saved and an RFQ ID is generated',
          'Team follows up manually from saved information'
        ]
      },
      rfqFields: [
        { key: 'name', backendKey: 'name', label: 'Name', type: 'text', required: true, placeholder: 'John Smith', autoComplete: 'name' },
        { key: 'company', backendKey: 'company', label: 'Company', type: 'text', required: false, placeholder: 'Acme Robotics', autoComplete: 'organization' },
        { key: 'email', backendKey: 'email', label: 'Email', type: 'email', required: true, placeholder: 'john.smith@email.com', autoComplete: 'email' },
        { key: 'phone_or_whatsapp', backendKey: 'phone_or_whatsapp', label: 'Phone / WhatsApp', type: 'text', required: false, placeholder: '+1 512 555 0198', autoComplete: 'tel' },
        { key: 'country', backendKey: 'country', label: 'Country', type: 'text', required: true, placeholder: 'United States', autoComplete: 'country-name' },
        { key: 'process', backendKey: 'product', label: 'Process', type: 'select', required: true, options: ['CNC Milling', 'CNC Turning', 'CNC Milling + Turning', 'Prototype', 'Small Production'] },
        { key: 'material', backendKey: 'material', notesPrefix: 'Material', label: 'Material', type: 'text', required: false, placeholder: 'Aluminum 6061 / stainless steel', span: 1 },
        { key: 'quantity', backendKey: 'quantity', label: 'Quantity', type: 'text', required: true, placeholder: '3 sets' },
        { key: 'dimensions', backendKey: 'specs', label: 'Dimensions', type: 'text', required: false, placeholder: '1800 × 1200 × 2000 mm' },
        { key: 'tolerance', notesPrefix: 'Tolerance', label: 'Tolerance', type: 'text', required: false, placeholder: '±0.10 mm' },
        { key: 'surfaceFinish', notesPrefix: 'Surface Finish', label: 'Surface Finish', type: 'text', required: false, placeholder: 'Anodized / Ra 1.6' },
        { key: 'projectDescription', notesPrefix: 'Project Description', label: 'Project Description', type: 'textarea', required: false, placeholder: 'Usage scenario, machine environment, assembly requirements...', span: 'full' }
      ]
    };

    function safe(v, fallback = 'N/A') {
      const value = String(v || '').trim();
      return value || fallback;
    }

    function setTheme() {
      const root = document.documentElement;
      root.style.setProperty('--primary', APP_CONFIG.brand.colors.primary);
      root.style.setProperty('--primary-2', APP_CONFIG.brand.colors.secondary);
    }

    function buildBrandAndNav() {
      const topbar = document.getElementById('topbar');
      const nav = document.createElement('nav');
      nav.className = 'nav';
      APP_CONFIG.brand.navigation.forEach((item) => {
        const link = document.createElement('a');
        link.href = item.href;
        link.textContent = item.label;
        nav.appendChild(link);
      });

      const logoText = APP_CONFIG.brand.logo.type === 'text' ? ` <div class="brand-mark" aria-hidden="true">${APP_CONFIG.brand.logo.value}</div>` : '<div class="brand-mark" aria-hidden="true">●</div>';
      topbar.innerHTML = `<div class="brand">${logoText}<div class="brand-name"><strong>${APP_CONFIG.brand.companyName}</strong><span>${APP_CONFIG.brand.tagline}</span></div></div>`;
      topbar.appendChild(nav);
    }

    function createTag(label) {
      const tag = document.createElement('span');
      tag.className = 'chip';
      tag.textContent = label;
      return tag;
    }

    function renderHero() {
      const section = document.getElementById('home');
      const content = APP_CONFIG.brand.hero;
      section.innerHTML = `
        <div class="hero-copy">
          <p class="tag">${content.eyebrow}</p>
          <h1>${content.title}</h1>
          <p>${content.description}</p>
          <div class="cta">
            <a class="btn" href="#request-a-quote">${content.ctaPrimary}</a>
            <a class="btn secondary" href="#capabilities">${content.ctaSecondary}</a>
          </div>
          <div class="mini-proof"></div>
        </div>
        <div class="hero-visual" role="img" aria-label="${content.visualLabel}">
          <div class="machine-photo"></div>
        </div>
      `;
      const miniProof = section.querySelector('.mini-proof');
      content.strengths.forEach((item) => {
        const badge = document.createElement('span');
        badge.className = 'help chip';
        badge.style.display = 'inline-flex';
        badge.style.alignItems = 'center';
        badge.style.marginTop = '14px';
        badge.textContent = `✓ ${item}`;
        miniProof.appendChild(badge);
      });
    }

    function renderCapabilities() {
      const section = document.getElementById('capabilities');
      section.innerHTML = `
        <div class="section-head">
          <div>
            <h2>Capabilities</h2>
            <p>All technical capabilities below are demo/example references for structure and conversion guidance.</p>
          </div>
        </div>
      `;

      const grid = document.createElement('div');
      grid.className = 'card-grid';
      APP_CONFIG.brand.capabilities.forEach((cap) => {
        const card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-top">${cap.icon}</div>
          <h3>${cap.title}</h3>
          <p>${cap.description}</p>
          <div class="chip-list"></div>
        `;
        const chipWrap = card.querySelector('.chip-list');
        cap.tags.forEach((tag) => chipWrap.appendChild(createTag(tag)));
        grid.appendChild(card);
      });
      section.appendChild(grid);

      const wf = document.createElement('div');
      wf.className = 'workflow';
      APP_CONFIG.brand.workflow.forEach((step, index) => {
        const node = document.createElement('div');
        node.className = 'wf';
        node.innerHTML = `<strong>Step ${index + 1}</strong><span>${step}</span>`;
        wf.appendChild(node);
      });
      section.appendChild(wf);
    }

    function renderAbout() {
      const section = document.getElementById('about');
      section.innerHTML = `
        <div class="section-head">
          <div>
            <h2>About</h2>
            <p>This page is an intentionally educational sales demo. Company story and operational claims are illustrative only.</p>
          </div>
        </div>
        <div class="about-grid">
          <article class="about-card">
            <h3>Purpose of this site</h3>
            <p>Help clients understand that a clean industrial RFQ page can be built from one shared page structure.</p>
          </article>
          <article class="about-card">
            <h3>What is real in this demo</h3>
            <ul>
              <li>Form submits to a real RFQ endpoint.</li>
              <li>RFQ ID appears after submit.</li>
              <li>Lead data is saved by backend flow.</li>
              <li>Submission is visible immediately on screen with status.</li>
            </ul>
          </article>
          <article class="about-card">
            <h3>Brand placeholder</h3>
            <p>Use this demo for internal demo use, then replace text and colors for a target customer brand.</p>
          </article>
          <article class="about-card">
            <h3>Contact label</h3>
            <p>${APP_CONFIG.brand.contact.email}<br>${APP_CONFIG.brand.contact.phone}<br>${APP_CONFIG.brand.contact.location}</p>
          </article>
        </div>
      `;
    }

    function createInputFromField(field) {
      const label = document.createElement('label');
      const isFull = field.span === 'full';
      label.className = `field ${isFull ? 'full' : ''}`;
      const requiredMark = field.required ? '<span class="required">*</span>' : '';
      const title = `${field.label}${requiredMark}`;
      label.innerHTML = `<span>${title}</span>`;
      let control;

      if (field.type === 'textarea') {
        control = document.createElement('textarea');
      } else if (field.type === 'select') {
        control = document.createElement('select');
        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = 'Select';
        control.appendChild(placeholder);
        field.options.forEach((optionValue) => {
          const opt = document.createElement('option');
          opt.value = optionValue;
          opt.textContent = optionValue;
          control.appendChild(opt);
        });
      } else {
        control = document.createElement('input');
        control.type = field.type;
      }

      control.id = `field-${field.key}`;
      control.name = field.key;
      control.placeholder = field.placeholder || '';
      control.required = !!field.required;
      if (field.autoComplete) control.autocomplete = field.autoComplete;

      label.appendChild(control);
      return { label, control };
    }

    function renderForm() {
      const section = document.getElementById('request-a-quote');
      section.innerHTML = `
        <div class="section-head">
          <div>
            <h2>Request a Quote</h2>
            <p>Submit one inquiry with structured CNC fields used by real sales workflows.</p>
          </div>
        </div>
        <div class="request-grid">
          <form id="rfqForm" class="request-main">
            <h3>RFQ Form</h3>
            <div class="form-grid" id="formFields"></div>
            <label class="consent">
              <input type="checkbox" id="rfq-consent" required />
              <span>I agree this request can be stored and used for follow-up.</span>
            </label>
            <button type="submit" class="submit-btn" id="submitBtn">Submit RFQ</button>
            <div id="submitStatus" class="status-box"></div>
            <div style="margin-top:10px">
              <button type="button" class="btn secondary" id="sampleBtn">Fill with sample</button>
            </div>
            <p class=\"demo-note\">Email notifications may return not configured / failed in the demo. RFQ is still saved successfully.</p>
          </form>
          <aside class="request-side">
            <h3>After Submission</h3>
            <ul>
              <li>RFQ is saved and an ID is generated.</li>
              <li>Team receives standard lead payload.</li>
              <li>Manual follow-up keeps pricing and lead-time control.</li>
            </ul>
            <p>Demo only. No payments, no AI auto-quote, no log-in and no admin panel.</p>
          </aside>
        </div>
      `;

      const formFields = section.querySelector('#formFields');
      APP_CONFIG.rfqFields.forEach((field) => {
        const item = createInputFromField(field);
        formFields.appendChild(item.label);
      });

      section.querySelector('#sampleBtn').addEventListener('click', fillSample);
      section.querySelector('#rfqForm').addEventListener('submit', handleSubmit);
    }

    function readValues() {
      const values = {};
      APP_CONFIG.rfqFields.forEach((field) => {
        const fieldElement = document.getElementById(`field-${field.key}`);
        values[field.key] = fieldElement ? String(fieldElement.value || '').trim() : '';
      });
      values.consent = document.getElementById('rfq-consent').checked;
      return values;
    }

    function buildPayload(values) {
      const notes = [];
      const payload = {
        name: safe(values.name, ''),
        company: safe(values.company, 'N/A'),
        email: safe(values.email, ''),
        phone_or_whatsapp: safe(values.phone_or_whatsapp, 'N/A'),
        country: safe(values.country, ''),
        product: 'N/A',
        quantity: safe(values.quantity, 'N/A'),
        specs: 'N/A',
        notes: 'N/A',
        material: 'N/A',
        usecase: 'N/A',
        date: '',
        consent: !!values.consent,
      };

      APP_CONFIG.rfqFields.forEach((field) => {
        const value = safe(values[field.key], '');
        if (!value) return;
        if (field.backendKey) {
          payload[field.backendKey] = value;
        }
        if (field.notesPrefix) {
          notes.push(`${field.notesPrefix}: ${value}`);
        }
      });

      if (notes.length) {
        payload.notes = notes.join('\n');
      }

      return payload;
    }

    function showStatus(message, type) {
      const status = document.getElementById('submitStatus');
      status.textContent = message;
      status.className = `status-box show ${type}`;
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(window.__rfqToastTimer);
      window.__rfqToastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    async function handleSubmit(event) {
      event.preventDefault();
      const form = event.currentTarget;
      const submitBtn = document.getElementById('submitBtn');
      const values = readValues();

      if (!form.checkValidity()) {
        showToast('Please complete required fields.');
        return;
      }

      if (!values.consent) {
        showStatus('Please confirm the consent checkbox.', 'error');
        return;
      }

      const payload = buildPayload(values);
      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting...';
      showStatus('Submitting...', '');
      try {
        const response = await fetch('/api/rfq', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || result.success === false) {
          const msg = result && result.message ? result.message : 'Submission failed.';
          showStatus(msg, 'error');
          return;
        }

        const statusValue = result?.data?.notification?.status || 'unknown';
        const rfqId = result?.data?.id || 'N/A';
        let extra = '';
        if (statusValue === 'sent') extra = 'Notification sent.';
        if (statusValue === 'not_configured') extra = 'Notification is not configured.';
        if (statusValue === 'failed') extra = 'Notification failed after saving.';

        showStatus(`Quote saved successfully. RFQ ID: ${rfqId}. ${extra}`, 'success');
        showToast(`Submitted: ${rfqId}`);
        form.reset();
        document.getElementById('rfq-consent').checked = false;
      } catch (error) {
        const msg = error instanceof Error ? error.message : 'Network error';
        showStatus(`Submission failed: ${msg}`, 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit RFQ';
      }
    }

    function fillSample() {
      const sample = {
        name: 'John Smith',
        company: 'Test Automation',
        email: 'john.smith@clientexample.com',
        phone_or_whatsapp: '+1 555-111-2222',
        country: 'United States',
        process: 'CNC Milling',
        material: 'Aluminum 6061',
        quantity: '3 sets',
        dimensions: '1800 × 1200 × 2000 mm',
        tolerance: '±0.10 mm',
        surfaceFinish: 'Anodized',
        projectDescription: 'Used for automated equipment. Please send lead time and rough quote.'
      };

      APP_CONFIG.rfqFields.forEach((field) => {
        const input = document.getElementById(`field-${field.key}`);
        if (!input) return;
        input.value = sample[field.key] || '';
      });

      document.getElementById('rfq-consent').checked = true;
      showToast('Sample data loaded');
    }

    function renderAll() {
      setTheme();
      buildBrandAndNav();
      renderHero();
      renderCapabilities();
      renderAbout();
      renderForm();
    }

    renderAll();
  </script>
</body>
</html>
