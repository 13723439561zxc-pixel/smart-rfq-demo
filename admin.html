<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>RFQ Management | Apex Precision</title>
  <style>
    :root {
      --ink: #17253a;
      --muted: #607086;
      --line: #dce4ee;
      --surface: #ffffff;
      --canvas: #f4f7fa;
      --primary: #0f4f9e;
      --primary-dark: #0d3f7a;
      --success: #17704b;
      --danger: #a33a32;
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); }
    button, select { font: inherit; }
    button:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid #8bb9ee; outline-offset: 2px; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 72px;
      padding: 14px clamp(18px, 4vw, 56px);
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      border-radius: 9px;
      background: var(--primary);
      color: white;
      font-weight: 800;
      letter-spacing: .04em;
    }
    .brand strong, .brand span { display: block; }
    .brand strong { font-size: 16px; }
    .brand span { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .site-link { color: var(--primary); font-size: 13px; font-weight: 700; text-decoration: none; white-space: nowrap; }

    main { width: min(1460px, 100%); margin: 0 auto; padding: 30px clamp(16px, 4vw, 48px) 48px; }
    .heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 22px; }
    h1 { margin: 0; font-size: clamp(26px, 4vw, 38px); letter-spacing: -.03em; }
    .heading p { margin: 7px 0 0; color: var(--muted); }
    .count { color: var(--muted); font-size: 13px; white-space: nowrap; }

    .toolbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      padding: 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .filter { display: flex; align-items: end; gap: 10px; }
    label span { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; font-weight: 700; }
    select, button {
      min-height: 42px;
      border: 1px solid #c8d3df;
      border-radius: 8px;
      background: white;
      color: var(--ink);
    }
    select { min-width: 150px; padding: 0 34px 0 11px; }
    button { padding: 0 15px; cursor: pointer; font-weight: 700; }
    button:hover { border-color: var(--primary); color: var(--primary); }
    button:disabled, select:disabled { cursor: wait; opacity: .62; }

    .message { display: none; margin-bottom: 16px; padding: 12px 14px; border-radius: 9px; font-size: 14px; }
    .message.show { display: block; }
    .message.error { background: #fff0ee; color: var(--danger); border: 1px solid #efc7c2; }
    .message.success { background: #edf8f3; color: var(--success); border: 1px solid #c6e4d7; }

    .table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
    table { width: 100%; min-width: 1500px; border-collapse: collapse; }
    th, td { padding: 13px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { position: sticky; top: 0; z-index: 1; background: #edf3f8; color: #40536b; font-size: 11px; letter-spacing: .05em; text-transform: uppercase; }
    td { max-width: 230px; font-size: 13px; line-height: 1.45; overflow-wrap: anywhere; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: #f8fafc; }
    th:last-child, td:last-child { position: sticky; right: 0; background: var(--surface); box-shadow: -1px 0 0 var(--line); }
    th:last-child { background: #edf3f8; }
    .rfq-id { color: var(--primary-dark); font-weight: 800; white-space: nowrap; }
    .date { white-space: nowrap; color: var(--muted); }
    .status-select { min-width: 126px; min-height: 38px; font-size: 12px; font-weight: 700; text-transform: capitalize; }
    .empty { display: none; padding: 54px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); text-align: center; }
    .empty.show { display: block; }

    @media (max-width: 720px) {
      .topbar { min-height: 64px; padding: 11px 16px; }
      .brand span { display: none; }
      main { padding-top: 22px; }
      .heading { display: block; }
      .count { display: block; margin-top: 9px; }
      .toolbar, .filter { align-items: stretch; min-width: 0; }
      .toolbar { flex-direction: column; }
      .filter { display: grid; grid-template-columns: minmax(0, 1fr); width: 100%; }
      .filter label, .filter select, .filter button { width: 100%; min-width: 0; }
      .toolbar > button { width: 100%; }
      .table-wrap { overflow: visible; border: 0; background: transparent; }
      table, tbody, tr, td { display: block; width: 100%; min-width: 0; }
      thead { display: none; }
      tbody { display: grid; gap: 14px; }
      tr { padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
      td {
        display: grid;
        grid-template-columns: 116px minmax(0, 1fr);
        gap: 10px;
        max-width: none;
        padding: 9px 0;
        border-bottom: 1px solid #e8edf3;
      }
      td::before { content: attr(data-label); color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
      td:last-child { padding-bottom: 0; border-bottom: 0; }
      th:last-child, td:last-child { position: static; box-shadow: none; }
      .status-select { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">AP</div>
      <div><strong>Apex Precision</strong><span>RFQ Management</span></div>
    </div>
    <a class="site-link" href="/">View website</a>
  </header>

  <main>
    <div class="heading">
      <div>
        <h1>RFQ Management</h1>
        <p>Review incoming requests and keep each opportunity moving.</p>
      </div>
      <span class="count" id="count">Loading…</span>
    </div>

    <div class="toolbar">
      <div class="filter">
        <label>
          <span>Filter by status</span>
          <select id="statusFilter">
            <option value="">All statuses</option>
            <option value="new">New</option>
            <option value="contacted">Contacted</option>
            <option value="quoted">Quoted</option>
            <option value="won">Won</option>
            <option value="lost">Lost</option>
          </select>
        </label>
        <button type="button" id="applyFilter">Apply</button>
      </div>
      <button type="button" id="refreshButton">Refresh</button>
    </div>

    <div class="message" id="message" role="status"></div>
    <div class="table-wrap" id="tableWrap">
      <table>
        <thead>
          <tr>
            <th>ID</th><th>Created</th><th>Name</th><th>Company</th><th>Email</th><th>Phone / WhatsApp</th>
            <th>Country</th><th>Product</th><th>Quantity</th><th>Specifications</th><th>Notes</th><th>Status</th>
          </tr>
        </thead>
        <tbody id="rfqRows"></tbody>
      </table>
    </div>
    <div class="empty" id="emptyState">No RFQs match this filter.</div>
  </main>

  <script>
    const STATUS_OPTIONS = ['new', 'contacted', 'quoted', 'won', 'lost'];
    const columns = [
      ['id', 'ID'], ['created_at', 'Created'], ['name', 'Name'], ['company', 'Company'], ['email', 'Email'],
      ['phone_or_whatsapp', 'Phone / WhatsApp'], ['country', 'Country'], ['product', 'Product'], ['quantity', 'Quantity'],
      ['specifications', 'Specifications'], ['notes', 'Notes']
    ];

    const rowsElement = document.getElementById('rfqRows');
    const tableWrap = document.getElementById('tableWrap');
    const emptyState = document.getElementById('emptyState');
    const countElement = document.getElementById('count');
    const messageElement = document.getElementById('message');
    const filterElement = document.getElementById('statusFilter');
    const refreshButton = document.getElementById('refreshButton');

    function showMessage(text, type = '') {
      messageElement.textContent = text;
      messageElement.className = text ? `message show ${type}` : 'message';
    }

    function formatDate(value) {
      if (!value) return '—';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return date.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
    }

    function createCell(label, value, className = '') {
      const cell = document.createElement('td');
      cell.dataset.label = label;
      cell.textContent = value === null || value === undefined || value === '' ? '—' : String(value);
      if (className) cell.className = className;
      return cell;
    }

    function createStatusCell(rfq) {
      const cell = document.createElement('td');
      cell.dataset.label = 'Status';
      const select = document.createElement('select');
      select.className = 'status-select';
      select.setAttribute('aria-label', `Status for ${rfq.id}`);
      STATUS_OPTIONS.forEach((status) => {
        const option = document.createElement('option');
        option.value = status;
        option.textContent = status.charAt(0).toUpperCase() + status.slice(1);
        option.selected = status === rfq.status;
        select.appendChild(option);
      });
      select.dataset.currentStatus = rfq.status;
      select.addEventListener('change', () => updateStatus(rfq.id, select));
      cell.appendChild(select);
      return cell;
    }

    function renderRows(rfqs) {
      rowsElement.replaceChildren();
      rfqs.forEach((rfq) => {
        const row = document.createElement('tr');
        columns.forEach(([key, label]) => {
          const value = key === 'created_at' ? formatDate(rfq[key]) : rfq[key];
          const className = key === 'id' ? 'rfq-id' : key === 'created_at' ? 'date' : '';
          row.appendChild(createCell(label, value, className));
        });
        row.appendChild(createStatusCell(rfq));
        rowsElement.appendChild(row);
      });

      tableWrap.hidden = rfqs.length === 0;
      emptyState.classList.toggle('show', rfqs.length === 0);
      countElement.textContent = `${rfqs.length} RFQ${rfqs.length === 1 ? '' : 's'}`;
    }

    async function loadRfqs() {
      showMessage('');
      refreshButton.disabled = true;
      countElement.textContent = 'Loading…';
      try {
        const status = filterElement.value;
        const query = status ? `?status=${encodeURIComponent(status)}` : '';
        const response = await fetch(`/api/admin/rfqs${query}`, { cache: 'no-store', credentials: 'same-origin' });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || result.success === false) {
          throw new Error(result.message || 'Unable to load RFQs.');
        }
        renderRows(result.data?.rfqs || []);
      } catch (error) {
        rowsElement.replaceChildren();
        tableWrap.hidden = true;
        emptyState.classList.remove('show');
        countElement.textContent = 'Unavailable';
        showMessage(error.message || 'Unable to load RFQs.', 'error');
      } finally {
        refreshButton.disabled = false;
      }
    }

    async function updateStatus(id, select) {
      const nextStatus = select.value;
      const previousStatus = select.dataset.currentStatus;
      select.disabled = true;
      showMessage('');
      try {
        const response = await fetch(`/api/admin/rfqs/${encodeURIComponent(id)}/status`, {
          method: 'PATCH',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: nextStatus })
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || result.success === false) {
          throw new Error(result.message || 'Unable to update status.');
        }
        select.dataset.currentStatus = nextStatus;
        showMessage(`${id} updated to ${nextStatus}.`, 'success');
        if (filterElement.value && filterElement.value !== nextStatus) await loadRfqs();
      } catch (error) {
        select.value = previousStatus;
        showMessage(error.message || 'Unable to update status.', 'error');
      } finally {
        select.disabled = false;
      }
    }

    document.getElementById('applyFilter').addEventListener('click', loadRfqs);
    refreshButton.addEventListener('click', loadRfqs);
    filterElement.addEventListener('change', loadRfqs);
    loadRfqs();
  </script>
</body>
</html>
