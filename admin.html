<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>RFQ Management | Apex Precision</title>
  <style>
    :root {
      --ink: #17253a; --muted: #607086; --line: #dce4ee; --surface: #fff; --canvas: #f4f7fa;
      --primary: #0f4f9e; --primary-dark: #0d3f7a; --danger: #a33a32;
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { min-width: 0; margin: 0; background: var(--canvas); color: var(--ink); }
    button, input, select { font: inherit; }
    button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid #8bb9ee; outline-offset: 2px; }

    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 72px; padding: 14px clamp(18px, 4vw, 56px); background: var(--surface); border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark { display: grid; place-items: center; width: 42px; height: 42px; flex: 0 0 auto; border-radius: 9px; background: var(--primary); color: white; font-weight: 800; letter-spacing: .04em; }
    .brand strong, .brand span { display: block; }
    .brand strong { font-size: 16px; }
    .brand span { margin-top: 2px; color: var(--muted); font-size: 12px; }
    .site-link { color: var(--primary); font-size: 13px; font-weight: 750; text-decoration: none; white-space: nowrap; }

    main { width: min(1320px, 100%); margin: 0 auto; padding: 30px clamp(16px, 4vw, 48px) 56px; }
    .heading { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: clamp(26px, 4vw, 38px); letter-spacing: -.03em; }
    .heading p { margin: 7px 0 0; color: var(--muted); }
    .result-count { color: var(--muted); font-size: 13px; white-space: nowrap; }

    .stats-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
    .stat-card { min-width: 0; padding: 15px; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid #9bb4ce; border-radius: 11px; }
    .stat-card[data-status="new"] { border-top-color: #3f7dbc; }
    .stat-card[data-status="contacted"] { border-top-color: #76899f; }
    .stat-card[data-status="quoted"] { border-top-color: #9c78bb; }
    .stat-card[data-status="won"] { border-top-color: #4b9673; background: #fbfefc; }
    .stat-card[data-status="lost"] { border-top-color: #b9857d; background: #fffdfc; }
    .stat-label { display: block; color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .045em; text-transform: uppercase; }
    .stat-value { display: block; margin-top: 6px; font-size: clamp(22px, 3vw, 30px); font-weight: 800; line-height: 1; }

    .toolbar { display: grid; grid-template-columns: minmax(240px, 1fr) 170px 170px auto auto; align-items: end; gap: 10px; margin-bottom: 18px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
    .control { min-width: 0; }
    .control span { display: block; margin-bottom: 6px; color: var(--muted); font-size: 11px; font-weight: 800; }
    input, select, button, .button-link { min-height: 44px; border: 1px solid #c8d3df; border-radius: 8px; background: white; color: var(--ink); }
    input, select { width: 100%; min-width: 0; padding: 0 12px; }
    select { padding-right: 34px; }
    button, .button-link { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 15px; cursor: pointer; font-weight: 750; text-decoration: none; white-space: nowrap; }
    button:hover, .button-link:hover { border-color: var(--primary); color: var(--primary); }
    button:disabled, select:disabled { cursor: wait; opacity: .6; }
    .primary-button { border-color: var(--primary); background: var(--primary); color: white; }
    .primary-button:hover { background: var(--primary-dark); color: white; }
    .quiet-button { color: var(--primary); }

    .notice { display: none; margin-bottom: 16px; padding: 12px 14px; border-radius: 9px; font-size: 14px; }
    .notice.show { display: block; }
    .notice.error { background: #fff0ee; color: var(--danger); border: 1px solid #efc7c2; }
    .loading, .empty { display: none; padding: 48px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; color: var(--muted); text-align: center; }
    .loading.show, .empty.show { display: block; }
    .loading strong, .empty strong { display: block; margin-bottom: 6px; color: var(--ink); font-size: 17px; }

    .rfq-list { display: grid; gap: 14px; }
    .rfq-card { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 5px 16px rgba(28, 52, 81, .045); }
    .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 15px 17px; border-bottom: 1px solid #e8edf3; }
    .rfq-id { color: var(--primary-dark); font-size: 14px; font-weight: 850; overflow-wrap: anywhere; }
    .created { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
    .status-badge { display: inline-flex; align-items: center; min-height: 27px; padding: 3px 9px; border-radius: 999px; background: #edf3f8; color: #40566f; font-size: 11px; font-weight: 850; text-transform: capitalize; white-space: nowrap; }
    .status-new { background: #eaf3fd; color: #235b91; }
    .status-contacted { background: #edf1f4; color: #53667b; }
    .status-quoted { background: #f3edf8; color: #75518f; }
    .status-won { background: #e8f5ee; color: #276a4a; }
    .status-lost { background: #f8eeec; color: #8c5048; }

    .summary-grid { display: grid; grid-template-columns: 1.2fr 1.2fr 1.1fr .65fr; gap: 14px; padding: 15px 17px; }
    .summary-item, .detail-item { min-width: 0; }
    .field-label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 10px; font-weight: 850; letter-spacing: .045em; text-transform: uppercase; }
    .field-value { display: block; font-size: 14px; line-height: 1.45; overflow-wrap: anywhere; white-space: pre-wrap; }
    .field-value.strong { font-weight: 750; }

    .card-actions { display: flex; align-items: end; justify-content: space-between; flex-wrap: wrap; gap: 10px; padding: 13px 17px; background: #f9fbfd; border-top: 1px solid #e8edf3; border-radius: 0 0 12px 12px; }
    .action-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .card-actions button, .card-actions .button-link { min-height: 42px; font-size: 12px; }
    .status-control { min-width: 150px; }
    .status-control select { min-height: 42px; font-size: 12px; font-weight: 750; text-transform: capitalize; }

    .details { padding: 17px; border-top: 1px solid #e8edf3; }
    .details[hidden] { display: none; }
    .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .detail-section { min-width: 0; padding: 14px; border: 1px solid #e2e9f0; border-radius: 9px; }
    .detail-section h3 { margin: 0 0 12px; font-size: 13px; letter-spacing: .01em; }
    .detail-items { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .detail-section.requirements .detail-items { grid-template-columns: 1fr; }

    .load-more-wrap { display: flex; justify-content: center; margin-top: 18px; }
    .load-more-wrap button { min-width: 180px; }
    .toast { position: fixed; left: 50%; bottom: 18px; z-index: 10; max-width: calc(100% - 32px); padding: 11px 15px; border-radius: 9px; background: #173552; color: white; font-size: 13px; font-weight: 700; opacity: 0; pointer-events: none; transform: translate(-50%, 18px); transition: opacity .16s ease, transform .16s ease; }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 980px) {
      .stats-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .toolbar { grid-template-columns: minmax(220px, 1fr) 1fr 1fr; }
      .toolbar button { width: 100%; }
      .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 620px) {
      .topbar { min-height: 64px; padding: 11px 16px; }
      .brand span { display: none; }
      main { padding-top: 22px; }
      .heading { display: block; }
      .result-count { display: block; margin-top: 9px; }
      .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stat-card { padding: 13px; }
      .toolbar { grid-template-columns: minmax(0, 1fr); }
      .summary-grid, .detail-grid, .detail-items { grid-template-columns: minmax(0, 1fr); }
      .card-head, .summary-grid, .details { padding-left: 14px; padding-right: 14px; }
      .card-actions { display: grid; grid-template-columns: minmax(0, 1fr); padding: 13px 14px; }
      .action-group { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .action-group > * { width: 100%; min-width: 0; }
      .status-control { width: 100%; min-width: 0; }
      .status-control select { width: 100%; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="brand-mark" aria-hidden="true">AP</div><div><strong>Apex Precision</strong><span>RFQ Management</span></div></div>
    <a class="site-link" href="/">View website</a>
  </header>

  <main>
    <div class="heading"><div><h1>RFQ Management</h1><p>Review incoming requests and keep each opportunity moving.</p></div><span class="result-count" id="resultCount">Loading RFQs…</span></div>

    <section class="stats-grid" aria-label="RFQ statistics">
      <article class="stat-card" data-status="total"><span class="stat-label">Total RFQs</span><strong class="stat-value" id="stat-total">—</strong></article>
      <article class="stat-card" data-status="new"><span class="stat-label">New</span><strong class="stat-value" id="stat-new">—</strong></article>
      <article class="stat-card" data-status="contacted"><span class="stat-label">Contacted</span><strong class="stat-value" id="stat-contacted">—</strong></article>
      <article class="stat-card" data-status="quoted"><span class="stat-label">Quoted</span><strong class="stat-value" id="stat-quoted">—</strong></article>
      <article class="stat-card" data-status="won"><span class="stat-label">Won</span><strong class="stat-value" id="stat-won">—</strong></article>
      <article class="stat-card" data-status="lost"><span class="stat-label">Lost</span><strong class="stat-value" id="stat-lost">—</strong></article>
    </section>

    <form class="toolbar" id="filterForm">
      <label class="control"><span>Search RFQs</span><input id="searchInput" type="search" maxlength="100" placeholder="ID, name, company, email, country or product"></label>
      <label class="control"><span>Status</span><select id="statusFilter"><option value="">All statuses</option><option value="new">New</option><option value="contacted">Contacted</option><option value="quoted">Quoted</option><option value="won">Won</option><option value="lost">Lost</option></select></label>
      <label class="control"><span>Sort by time</span><select id="sortOrder"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></label>
      <button class="primary-button" type="submit">Search</button>
      <button class="quiet-button" type="button" id="clearButton">Clear</button>
    </form>

    <div class="notice" id="errorNotice" role="alert"></div>
    <div class="loading show" id="loadingState" role="status"><strong>Loading RFQs…</strong><span>Retrieving the latest requests.</span></div>
    <div class="empty" id="emptyState"><strong id="emptyTitle">No RFQs yet</strong><span id="emptyText">New quote requests will appear here.</span></div>
    <section class="rfq-list" id="rfqList" aria-live="polite"></section>
    <div class="load-more-wrap"><button type="button" id="loadMoreButton" hidden>Load more</button></div>
  </main>
  <div class="toast" id="toast" role="status"></div>

  <script>
    const STATUS_OPTIONS = ['new', 'contacted', 'quoted', 'won', 'lost'];
    const PAGE_SIZE = 20;
    const state = { rows: [], stats: { total: 0, new: 0, contacted: 0, quoted: 0, won: 0, lost: 0 }, page: 1, total: 0, hasMore: false, loading: false };
    const listElement = document.getElementById('rfqList');
    const loadingState = document.getElementById('loadingState');
    const emptyState = document.getElementById('emptyState');
    const emptyTitle = document.getElementById('emptyTitle');
    const emptyText = document.getElementById('emptyText');
    const resultCount = document.getElementById('resultCount');
    const errorNotice = document.getElementById('errorNotice');
    const searchInput = document.getElementById('searchInput');
    const statusFilter = document.getElementById('statusFilter');
    const sortOrder = document.getElementById('sortOrder');
    const loadMoreButton = document.getElementById('loadMoreButton');

    function displayValue(value) {
      const normalized = String(value ?? '').trim();
      return normalized && !['N/A', '未填写'].includes(normalized) ? normalized : '—';
    }
    function displayStatus(status) {
      const value = STATUS_OPTIONS.includes(status) ? status : 'new';
      return value.charAt(0).toUpperCase() + value.slice(1);
    }
    function formatDate(value) {
      if (!value) return '—';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return date.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
    }
    function setText(element, value) { element.textContent = displayValue(value); return element; }
    function createElement(tag, className = '') { const element = document.createElement(tag); if (className) element.className = className; return element; }

    function createSummaryItem(label, value, strong = false) {
      const item = createElement('div', 'summary-item');
      const labelElement = createElement('span', 'field-label'); labelElement.textContent = label;
      const valueElement = createElement('span', `field-value${strong ? ' strong' : ''}`); setText(valueElement, value);
      item.append(labelElement, valueElement); return item;
    }
    function createDetailItem(label, value, extraClass = '') {
      const item = createElement('div', 'detail-item');
      const labelElement = createElement('span', 'field-label'); labelElement.textContent = label;
      const valueElement = createElement('span', `field-value ${extraClass}`.trim()); setText(valueElement, value);
      item.append(labelElement, valueElement); return item;
    }
    function createDetailSection(title, items, className = '') {
      const section = createElement('section', `detail-section ${className}`.trim());
      const heading = document.createElement('h3'); heading.textContent = title;
      const content = createElement('div', 'detail-items'); items.forEach((item) => content.appendChild(item));
      section.append(heading, content); return section;
    }
    function createStatusBadge(status) {
      const value = STATUS_OPTIONS.includes(status) ? status : 'new';
      const badge = createElement('span', `status-badge status-${value}`); badge.textContent = displayStatus(value); return badge;
    }
    function updateCardStatus(card, status) {
      const badge = card.querySelector('.status-badge'); badge.className = `status-badge status-${status}`; badge.textContent = displayStatus(status);
      const detailStatus = card.querySelector('.details-status'); if (detailStatus) detailStatus.textContent = displayStatus(status);
    }
    function validEmail(value) {
      const email = String(value || '').trim(); return email.length <= 254 && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? email : '';
    }
    function whatsappNumber(value) {
      const raw = String(value || '').trim();
      if (!raw || !/^(?:\+|00)[\d\s().-]{7,24}$/.test(raw)) return '';
      const international = raw.startsWith('00') ? raw.slice(2) : raw.slice(1);
      const digits = international.replace(/\D/g, ''); return /^[1-9]\d{7,14}$/.test(digits) ? digits : '';
    }
    function createContactLink(label, href) {
      const link = createElement('a', 'button-link'); link.textContent = label; link.href = href; return link;
    }
    function createStatusSelect(rfq, card) {
      const select = document.createElement('select'); select.setAttribute('aria-label', `Status for ${rfq.id}`);
      STATUS_OPTIONS.forEach((status) => {
        const option = document.createElement('option'); option.value = status; option.textContent = displayStatus(status); option.selected = status === rfq.status; select.appendChild(option);
      });
      select.dataset.currentStatus = STATUS_OPTIONS.includes(rfq.status) ? rfq.status : 'new';
      select.addEventListener('change', () => updateStatus(rfq, card, select)); return select;
    }

    function createRfqCard(rfq) {
      const card = createElement('article', 'rfq-card'); card.dataset.rfqId = rfq.id;
      const head = createElement('div', 'card-head');
      const identity = document.createElement('div');
      const id = createElement('div', 'rfq-id'); id.textContent = displayValue(rfq.id);
      const created = createElement('time', 'created'); created.dateTime = rfq.created_at || ''; created.textContent = formatDate(rfq.created_at);
      identity.append(id, created); head.append(identity, createStatusBadge(rfq.status));

      const summary = createElement('div', 'summary-grid');
      summary.append(createSummaryItem('Name', rfq.name, true), createSummaryItem('Company', rfq.company), createSummaryItem('Product', rfq.product), createSummaryItem('Quantity', rfq.quantity));

      const details = createElement('div', 'details'); details.hidden = true; details.id = `details-${String(rfq.id).replace(/[^a-zA-Z0-9_-]/g, '-')}`;
      const detailGrid = createElement('div', 'detail-grid');
      detailGrid.append(
        createDetailSection('Customer', [createDetailItem('Name', rfq.name), createDetailItem('Company', rfq.company), createDetailItem('Email', rfq.email), createDetailItem('Phone / WhatsApp', rfq.phone_or_whatsapp), createDetailItem('Country', rfq.country)]),
        createDetailSection('Inquiry', [createDetailItem('RFQ ID', rfq.id), createDetailItem('Created', formatDate(rfq.created_at)), createDetailItem('Product', rfq.product), createDetailItem('Quantity', rfq.quantity)]),
        createDetailSection('Requirements', [createDetailItem('Specifications', rfq.specifications), createDetailItem('Notes', rfq.notes)], 'requirements'),
        createDetailSection('Status', [createDetailItem('Current status', displayStatus(rfq.status), 'details-status')])
      );
      details.appendChild(detailGrid);

      const actions = createElement('div', 'card-actions');
      const actionGroup = createElement('div', 'action-group');
      const detailsButton = createElement('button', 'quiet-button'); detailsButton.type = 'button'; detailsButton.textContent = 'View details'; detailsButton.setAttribute('aria-expanded', 'false'); detailsButton.setAttribute('aria-controls', details.id);
      detailsButton.addEventListener('click', () => { details.hidden = !details.hidden; detailsButton.setAttribute('aria-expanded', String(!details.hidden)); detailsButton.textContent = details.hidden ? 'View details' : 'Hide details'; });
      actionGroup.appendChild(detailsButton);
      const email = validEmail(rfq.email); if (email) actionGroup.appendChild(createContactLink('Email customer', `mailto:${encodeURIComponent(email)}`));
      const whatsapp = whatsappNumber(rfq.phone_or_whatsapp);
      if (whatsapp) { const link = createContactLink('WhatsApp', `https://wa.me/${whatsapp}`); link.target = '_blank'; link.rel = 'noopener noreferrer'; actionGroup.appendChild(link); }
      const statusControl = createElement('label', 'control status-control');
      const statusLabel = document.createElement('span'); statusLabel.textContent = 'Update status'; statusControl.append(statusLabel, createStatusSelect(rfq, card));
      actions.append(actionGroup, statusControl);
      card.append(head, summary, details, actions); return card;
    }

    function renderStats() { ['total', ...STATUS_OPTIONS].forEach((status) => { document.getElementById(`stat-${status}`).textContent = String(state.stats[status] ?? 0); }); }
    function renderResultCount() {
      if (state.loading && state.rows.length === 0) { resultCount.textContent = 'Loading RFQs…'; return; }
      resultCount.textContent = state.total === state.rows.length ? `${state.total} RFQ${state.total === 1 ? '' : 's'}` : `Showing ${state.rows.length} of ${state.total} RFQs`;
    }
    function renderEmptyState() {
      const isEmpty = !state.loading && state.rows.length === 0 && !errorNotice.classList.contains('show'); emptyState.classList.toggle('show', isEmpty); if (!isEmpty) return;
      const search = searchInput.value.trim(); const status = statusFilter.value;
      if (search) { emptyTitle.textContent = 'No matching RFQs'; emptyText.textContent = status ? `No ${displayStatus(status).toLowerCase()} RFQs match “${search}”.` : `No RFQs match “${search}”.`; }
      else if (status) { emptyTitle.textContent = `No ${displayStatus(status)} RFQs`; emptyText.textContent = 'Choose another status or clear the filter.'; }
      else { emptyTitle.textContent = 'No RFQs yet'; emptyText.textContent = 'New quote requests will appear here.'; }
    }
    function updateListState() { renderResultCount(); renderEmptyState(); loadMoreButton.hidden = !state.hasMore || state.loading; }
    function showError(message) { errorNotice.textContent = message; errorNotice.className = 'notice show error'; }
    function clearError() { errorNotice.textContent = ''; errorNotice.className = 'notice'; }
    function showToast(message) {
      const toast = document.getElementById('toast'); toast.textContent = message; toast.classList.add('show'); clearTimeout(window.__rfqToastTimer); window.__rfqToastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
    }
    function buildListQuery(page) {
      const params = new URLSearchParams({ page: String(page), pageSize: String(PAGE_SIZE), sort: sortOrder.value });
      const search = searchInput.value.trim(); if (search) params.set('search', search); if (statusFilter.value) params.set('status', statusFilter.value); return params.toString();
    }

    async function loadRfqs({ append = false } = {}) {
      if (state.loading) return;
      state.loading = true; clearError();
      if (!append) { state.page = 1; state.rows = []; state.total = 0; state.hasMore = false; listElement.replaceChildren(); emptyState.classList.remove('show'); loadingState.classList.add('show'); }
      else { loadMoreButton.disabled = true; loadMoreButton.textContent = 'Loading…'; }
      renderResultCount();
      const requestedPage = append ? state.page + 1 : 1;
      try {
        const response = await fetch(`/api/admin/rfqs?${buildListQuery(requestedPage)}`, { cache: 'no-store', credentials: 'same-origin' });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || result.success === false) throw new Error(result.message || 'Unable to load RFQs.');
        const rows = result.data?.rfqs || [];
        state.page = result.data?.pagination?.page || requestedPage; state.total = result.data?.pagination?.total ?? rows.length; state.hasMore = Boolean(result.data?.pagination?.hasMore); state.stats = result.data?.stats || state.stats; state.rows = append ? state.rows.concat(rows) : rows;
        rows.forEach((rfq) => listElement.appendChild(createRfqCard(rfq))); renderStats();
      } catch (error) {
        if (!append) listElement.replaceChildren(); showError(error.message || 'Unable to load RFQs. Please try again.');
      } finally {
        state.loading = false; loadingState.classList.remove('show'); loadMoreButton.disabled = false; loadMoreButton.textContent = 'Load more'; updateListState();
      }
    }

    async function updateStatus(rfq, card, select) {
      const previousStatus = select.dataset.currentStatus; const nextStatus = select.value; select.disabled = true; clearError();
      try {
        const response = await fetch(`/api/admin/rfqs/${encodeURIComponent(rfq.id)}/status`, { method: 'PATCH', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: nextStatus }) });
        const result = await response.json().catch(() => ({}));
        if (!response.ok || result.success === false) throw new Error(result.message || 'Unable to update status.');
        rfq.status = nextStatus; select.dataset.currentStatus = nextStatus; updateCardStatus(card, nextStatus);
        if (previousStatus !== nextStatus) { state.stats[previousStatus] = Math.max(0, (state.stats[previousStatus] || 0) - 1); state.stats[nextStatus] = (state.stats[nextStatus] || 0) + 1; renderStats(); }
        if (statusFilter.value && statusFilter.value !== nextStatus) { state.rows = state.rows.filter((row) => row.id !== rfq.id); state.total = Math.max(0, state.total - 1); card.remove(); }
        updateListState(); showToast(`${rfq.id} updated to ${displayStatus(nextStatus)}.`);
      } catch (error) {
        select.value = previousStatus;
        const message = error.message || `Unable to update ${rfq.id}.`;
        showError(`${message} The status was not changed.`);
      } finally { select.disabled = false; }
    }

    document.getElementById('filterForm').addEventListener('submit', (event) => { event.preventDefault(); loadRfqs(); });
    statusFilter.addEventListener('change', () => loadRfqs());
    sortOrder.addEventListener('change', () => loadRfqs());
    document.getElementById('clearButton').addEventListener('click', () => { searchInput.value = ''; statusFilter.value = ''; sortOrder.value = 'newest'; loadRfqs(); });
    loadMoreButton.addEventListener('click', () => loadRfqs({ append: true }));
    loadRfqs();
  </script>
</body>
</html>
