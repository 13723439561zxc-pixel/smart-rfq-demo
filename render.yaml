services:
  - type: web
    name: smart-rfq-demo
    runtime: node
    plan: free
    region: oregon
    buildCommand: pnpm install
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: "0.0.0.0"
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        value: ""
      - key: SUPABASE_SERVICE_ROLE_KEY
        value: ""
      - key: SUPABASE_RFQ_TABLE
        value: rfqs
      - key: CORS_ORIGINS
        value: https://RENDER_SERVICE_NAME.onrender.com
      - key: SECURITY_HEADERS_ENABLED
        value: "true"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
